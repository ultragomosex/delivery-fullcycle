version: "3"

tasks:
  build:
    desc: Build backend binary
    cmds:
      - go build -o bin/server main.go

  run:
    desc: Run backend server
    cmds:
      - go run main.go

  clienthub:
    desc: Run clienthub load generator
    cmds:
      - go run tests/clienthub/main.go {{.CLI_ARGS}}


  test:
    desc: Run unit tests
    cmds:
      - go test -v ./...

  docker-build:
    desc: Build backend docker image
    cmds:
      - docker build -t delivery-backend:latest .
