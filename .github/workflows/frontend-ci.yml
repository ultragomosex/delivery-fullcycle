name: Frontend CI & CD

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
    branches:
      - master
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          REGISTRY="10.10.10.114:30000"
          IMAGE="10.10.10.114:30000/ultragomosex/delivery-frontend"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:dev-latest" -f frontend/Dockerfile frontend/
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:dev-latest"
