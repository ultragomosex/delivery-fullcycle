name: Backend CI & CD

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
    branches:
      - master
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        working-directory: backend
        run: |
          go test -v ./...

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          REGISTRY="10.10.10.114:30000"
          IMAGE="10.10.10.114:30000/ultragomosex/delivery-backend"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$REGISTRY"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:dev-latest" -f backend/Dockerfile backend/
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:dev-latest"
