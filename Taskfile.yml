version: "3"

includes:
  backend:
    taskfile: backend/Taskfile.yml
    dir: backend

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  k8s:build-dev:
    desc: Preview kustomize rendered manifests for dev
    cmds:
      - kubectl kustomize deploy/k8s/overlays/dev/backend
      - kubectl kustomize deploy/k8s/overlays/dev/frontend

  bootstrap:forgejo:
    desc: Deploy Forgejo bootstrap manifests to k8s
    cmds:
      - kubectl apply -k deploy/argocd/bootstrap/forgejo

  bootstrap:argocd:
    desc: Deploy ArgoCD bootstrap manifests to k8s
    cmds:
      - kubectl apply -k deploy/argocd/bootstrap/argocd

  bootstrap:rustfs:
    desc: Deploy RustFS bootstrap manifests to k8s
    cmds:
      - kubectl apply -k deploy/argocd/bootstrap/rustfs

  argocd:root:
    desc: Apply root ArgoCD app-of-apps
    cmds:
      - kubectl apply -f deploy/argocd/projects/delivery-fullcycle-project.yaml
      - kubectl apply -f deploy/argocd/root-app.yaml

  seed:users:
    desc: Parse and seed users into PostgreSQL from randomuser.me
    cmds:
      - go run ./utils/users.go {{.CLI_ARGS}}

  seed:products:
    desc: Parse and seed products into PostgreSQL from dummyjson.com
    cmds:
      - go run ./utils/products.go {{.CLI_ARGS}}

  migrate:media:
    desc: Migrate existing media from PostgreSQL to RustFS S3
    cmds:
      - go run ./utils/migrate_media.go {{.CLI_ARGS}}


