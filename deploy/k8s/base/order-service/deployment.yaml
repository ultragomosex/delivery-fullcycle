apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: delivery-fullcycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: delivery-registry
      containers:
        - name: order-service
          image: delivery-order:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: ":8082"
            - name: DATABASE_URL
              value: "postgres://delivery:delivery123@forgejo-db-rw.forgejo.svc.cluster.local:5432/delivery?sslmode=disable"
            - name: KAFKA_BROKERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC_ORDERS
              value: "orders.events"
          ports:
            - name: http
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
