  url: http://forgejo.forgejo.svc.cluster.local:3000/ultragomosex/delivery-fullcycle.git
  # Для публичного репозитория пароль не нужен, для приватного раскомментировать:
  # username: kazah
  # password: YOUR_FORGEJO_TOKEN_OR_PASSWORD
  insecure: "true"
