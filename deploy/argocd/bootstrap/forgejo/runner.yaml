apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-secret
  namespace: forgejo
type: Opaque
stringData:
  instance: "http://forgejo.forgejo.svc.cluster.local:3000"
  token: "g9ogoniTGeJ056h4plxjnnEqdsQdkdb7WCwgg3qi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
        - "docker:docker://docker:dind"
    cache:
      enabled: true
      dir: /data/cache
    container:
      privileged: true
      docker_host: "automount"
      workdir_parent: /data/workspace
      options: "-v /var/run/docker.sock:/var/run/docker.sock"
      valid_volumes:
        - '**'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      nodeSelector:
        workload: general
      containers:
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - --insecure-registry=10.10.10.114:30000
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: runner-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
        - name: runner
          image: data.forgejo.org/forgejo/runner:6
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Docker daemon..."
              while [ ! -S /var/run/docker.sock ]; do
                sleep 1
              done
              echo "Docker daemon ready."

              mkdir -p /data/workspace /data/cache

              if [ ! -s /data/.runner ]; then
                echo "Registering Forgejo runner..."
                forgejo-runner register \
                  --no-interactive \
                  --instance "$FORGEJO_INSTANCE" \
                  --token "$FORGEJO_TOKEN" \
                  --name "talos-worker-runner" \
                  --labels "ubuntu-latest:docker://catthehacker/ubuntu:act-latest,docker:docker://docker:dind"
              fi

              echo "Starting Forgejo runner daemon..."
              exec forgejo-runner daemon --config /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: FORGEJO_INSTANCE
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: instance
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: docker-sock
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: runner-config
          configMap:
            name: forgejo-runner-config
