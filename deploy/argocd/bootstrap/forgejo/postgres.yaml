apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: local-path
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  affinity:
    nodeSelector:
      workload: storage
