apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: delivery-fullcycle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      nodeSelector:
        workload: storage
      imagePullSecrets:
        - name: rustfs-registry
      initContainers:
        - name: init-chown
          image: 10.10.10.114:30000/ultragomosex/busybox:stable
          command:
            - sh
            - -c
            - chown -R 10001:10001 /data /logs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: rustfs
          image: 10.10.10.114:30000/ultragomosex/rustfs:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: rustfs-credentials
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          persistentVolumeClaim:
            claimName: rustfs-logs